<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Expense Management App - Reset Password'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto rounded border p-4 m-4">
            <h2 class="text-center mb-5" th:text="'Reset Password'"></h2>

            <form th:action="@{${formAction}}" method="post" enctype="multipart/form-data"
                  th:object="${userModel}">

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label" th:text="'Password'"></label>
                    <div class="col-sm-8">
                        <input class="form-control" type="password" name="userPassword" th:field="*{userPassword}">
                        <p th:if="${#fields.hasErrors('userPassword')}" th:errorclass="text-danger"
                           th:errors="*{userPassword}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label" th:text="'Confirm Password'"></label>
                    <div class="col-sm-8">
                        <input class="form-control" type="password" name="userPasswordConfirm"
                               th:field="*{userPasswordConfirm}">
                        <p th:if="${#fields.hasErrors('userPasswordConfirm')}" th:errorclass="text-danger"
                           th:errors="*{userPasswordConfirm}"></p>
                    </div>

                <div class="row">
                    <div class="offset-sm-4 col-sm-4 d-grid">
                        <button class="btn btn-primary" type="submit" th:text="'Submit'"></button>
                    </div>
                    <div class="col-sm-4 d-grid">
                        <a class="btn btn-danger" th:href="@{${redirectUrl}}" role="button"
                           onclick="return confirm('Are you sure?')" th:text="'Cancel'"></a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
