<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Expense Management App - Login'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container">
  <div class="row">
    <div class="col-md-8 mx-auto rounded border p-4 m-4">
      <h2 class="text-center mb-5" th:text="'Login'"></h2>

      <div th:if="${param.error}" th:text="'Invalid username and password.'" class="alert alert-error text-danger"></div>

      <form th:action="@{/auth/login}" method="post" enctype="multipart/form-data">

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Email'"></label>
          <div class="col-sm-8">
            <input class="form-control" type="email" name="userEmail"/>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Password'"></label>
          <div class="col-sm-8">
            <input class="form-control" type="password" name="userPassword">
          </div>
        </div>

        <div class="row">
          <div class="offset-sm-4 col-sm-4 d-grid">
            <button class="btn btn-primary" type="submit" th:text="'Submit'"></button>
          </div>
          <div class="col-sm-4 d-grid">
            <a class="btn btn-danger" th:href="@{/auth/login}" role="button"
               onclick="return confirm('Are you sure?')" th:text="'Cancel'"></a>
          </div>
        </div>

        <div class="d-flex justify-content-around align-items-center">
          <div>
            <h3 class="text-center mt-5" th:text="'Not registered?'"></h3>
            <a th:href="@{/auth/registration}" class="text-center" th:text="'Click here to register'"></a>
          </div>

          <div>
            <h3 class="text-center mt-5" th:text="'Forgot password?'"></h3>
            <a th:href="@{/auth/forgot-password}" class="text-center" th:text="'Click here to reset
              password'"></a>
          </div>
          <div>
            <h3 class="text-center mt-5" th:text="'Forgot Email'"></h3>
            <a th:href="@{/auth/forgot-email}" class="text-center" th:text="'Click here to lookup
              email'"></a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
