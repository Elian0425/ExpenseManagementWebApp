<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Expense Management App - Registration'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container">
  <div class="row">
    <div class="col-md-8 mx-auto rounded border p-4 m-4">

      <h2 class="text-center mb-5" th:text="${formTitle} + ' Debtor Debt'"></h2>

      <form th:action="@{${formAction}}" th:method="POST" enctype="multipart/form-data"
            th:object="${debtorDebtModel}">

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Name'"></label>
          <div class="col-sm-8">
            <input class="form-control" type="text" name="debtorDebtName" th:field="*{debtorDebtName}"/>
            <p th:if="${#fields.hasErrors('debtorDebtName')}" th:errorclass="text-danger"
               th:errors="*{debtorDebtName}"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Amount'"></label>
          <div class="col-sm-8">
            <input class="form-control" type="text" name="debtorDebtAmount" th:field="*{debtorDebtAmount}">
            <p th:if="${#fields.hasErrors('debtorDebtAmount')}" th:errorclass="text-danger"
               th:errors="*{debtorDebtAmount}"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Due Date'"></label>
          <div class="col-sm-8">
            <input class="form-control" type="date" name="debtorDebtDueDate" th:field="*{debtorDebtDueDate}">
            <p th:if="${#fields.hasErrors('debtorDebtDueDate')}" th:errorclass="text-danger"
               th:errors="*{debtorDebtDueDate}"></p>
          </div>
        </div>

        <div th:if="${formDecision} == 'update'" class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Status'"></label>
          <div class="col-sm-8">
            <select class="form-select" name="debtorDebtStatus" th:field="*{debtorDebtStatus}">
              <option value="default" th:text="'Choose Debt Status'"></option>
              <option th:each="debtorDebtStatus : ${debtorDebtStatusList}" th:value="${debtorDebtStatus.debtorDebtStatusName}"
                      th:text="${debtorDebtStatus.debtorDebtStatusName}"></option>
            </select>
            <p th:if="${#fields.hasErrors('debtorDebtStatus')}" th:errorclass="text-danger"
               th:errors="*{debtorDebtStatus}"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Type'"></label>
          <div class="col-sm-8">
            <select class="form-select" name="debtorDebtType" th:field="*{debtorDebtType}">
              <option value="default" th:text="'Choose Debt Type'"></option>
              <option th:each="debtorDebtType : ${debtorDebtTypeList}" th:value="${debtorDebtType.debtorDebtTypeName}"
                      th:text="${debtorDebtType.debtorDebtTypeName}"></option>
            </select>
            <p th:if="${#fields.hasErrors('debtorDebtType')}" th:errorclass="text-danger"
               th:errors="*{debtorDebtType}"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label" th:text="'Description'"></label>
          <div class="col-sm-8">
            <input class="form-control" type="text" name="userEmail" th:field="*{debtorDebtDescription}">
            <p th:if="${#fields.hasErrors('debtorDebtDescription')}" th:errorclass="text-danger"
               th:errors="*{debtorDebtDescription}"></p>
          </div>
        </div>

        <div class="row">
          <div class="offset-sm-4 col-sm-4 d-grid">
            <a class="btn btn-danger" th:href="@{'/dashboard/debtor/' + ${debtorId} + '/debt'}" role="button"
               onclick="return confirm('Are you sure?')" th:text="'Cancel'"></a>
          </div>
          <div class="col-sm-4 d-grid">
            <button class="btn btn-primary" type="submit" th:text="'Submit'"></button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
