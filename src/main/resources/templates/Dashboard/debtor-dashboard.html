<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Expense Management App - Debtor Dashboard'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-12 mx-auto mt-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-3" th:text="'Debtor Dashboard'"></h2>

                    <div class="d-flex justify-content-between mb-3">
                        <div>
                            <a class="btn btn-primary" th:href="@{/debtor/add}" th:text="'Add Debtor'"></a>
                        </div>

                        <div>
                            <form th:action="@{/dashboard/debtor/search}" method="get" class="d-flex" role="search">
                                <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Search name or email">
                                <button class="btn btn-outline-secondary btn-sm" type="submit">Search</button>
                            </form>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover table-bordered align-middle">
                            <thead class="table-light">
                            <tr>
                                <th scope="col" th:text="'Firstname'"></th>
                                <th scope="col" th:text="'Lastname'"></th>
                                <th scope="col" th:text="'Email'"></th>
                                <th scope="col" th:text="'Phone Number'"></th>
                                <th scope="col" th:text="'Actions'"></th>
                            </tr>
                            </thead>
                            <tbody>

                            <tr th:if="${debtorList == null or #lists.isEmpty(debtorList)}">
                                <td colspan="8" class="text-center py-4" th:text="'No debtors found.'"></td>
                            </tr>

                            <tr th:each="debtor, stat : ${debtorList}">

                                <!-- Expect debtor.firstName and debtor.lastName (adjust field names to your model) -->
                                <td th:text="${debtor.debtorFirstName}"></td>
                                <td th:text="${debtor.debtorLastName}"></td>
                                <td th:text="${debtor.debtorEmail}"></td>
                                <td th:text="${'(' + debtor.debtorPhoneNumber.substring(0, 3) +
                                            ') ' + debtor.debtorPhoneNumber.substring(3, 6) + '-'
                                            + debtor.debtorPhoneNumber.substring(6, 10)}">
                                </td>


                                <!-- Actions -->
                                <td>
                                    <a class="btn btn-sm btn-outline-success" th:href="@{'/dashboard/debtor/' + ${debtor.debtorId} + '/debt'}" th:text="'Manage Debt'"></a>
                                    <a class="btn btn-sm btn-outline-info" th:href="@{'/debtor/' + ${debtor.debtorId} + '/update'}" th:text="'Update'"></a>
                                    <a class="btn btn-sm btn-outline-danger" th:href="@{'/debtor/' + ${debtor.debtorId} + '/delete'}" th:text="'Delete'"></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3 d-flex justify-content-between">
                        <div>
                            <small class="text-muted">Total: <strong th:text="${debtorList != null ? debtorList.size() : 0}">0</strong> debtor</small>
                        </div>

                        <div>
                            <a class="btn btn-outline-danger"
                               th:href="@{/dashboard/user/menu}"
                               th:text="'Back'">
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
