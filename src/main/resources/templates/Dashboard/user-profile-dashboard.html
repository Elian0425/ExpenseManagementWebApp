<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Expense Management App - Profile'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-12 mx-auto mt-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4"
                        th:text="'Profile'">
                    </h2>
                    <!-- User Information -->
                    <div class="row g-4">
                        <!-- First Name -->
                        <div class="col-md-6">
                            <small class="text-muted">First Name</small>
                            <p class="fs-5 mb-0"
                               th:text="${user.userFirstName}">
                            </p>
                        </div>
                        <!-- Last Name -->
                        <div class="col-md-6">
                            <small class="text-muted">Last Name</small>
                            <p class="fs-5 mb-0"
                               th:text="${user.userLastName}">
                            </p>
                        </div>
                        <!-- Email -->
                        <div class="col-md-6">
                            <small class="text-muted">Email</small>
                            <p class="fs-5 mb-0"
                               th:text="${user.userEmail}">
                            </p>
                        </div>
                        <!-- Phone Number -->
                        <div class="col-md-6">
                            <small class="text-muted">Phone Number</small>
                            <p class="fs-5 mb-0"
                               th:text="${#strings.replace(#strings.replace(#strings.replace(user.userPhoneNumber, '-', ''),
                                '(', ''), ')', '') != null and #strings.length(#strings.replace(#strings.replace(#strings.replace(user.userPhoneNumber, '-', ''),
                                '(', ''), ')', '')) == 10 ? '(' + #strings.substring(#strings.replace(#strings.replace(#strings.replace(user.userPhoneNumber, '-', ''),
                                '(', ''), ')', ''), 0, 3) + ') ' + #strings.substring(#strings.replace(#strings.replace(#strings.replace(user.userPhoneNumber, '-', ''),
                                '(', ''), ')', ''), 3, 6) + '-' + #strings.substring(#strings.replace(#strings.replace(#strings.replace(user.userPhoneNumber, '-', ''),
                                '(', ''), ')', ''), 6, 10) : user.userPhoneNumber}">
                            </p>
                        </div>
                        <!-- Date of Birth -->
                        <div class="col-md-6">
                            <small class="text-muted">Date of Birth</small>
                            <p class="fs-5 mb-0"
                               th:text="${#temporals.format(user.userDOB, 'MM-dd-yyyy')}">
                            </p>
                        </div>
                        <!-- Gender -->
                        <div class="col-md-6">
                            <small class="text-muted">Gender</small>
                            <p class="fs-5 mb-0"
                               th:text="${user.userGender}">
                            </p>
                        </div>
                    </div>
                    <hr class="my-4">
                    <!-- Account Actions -->
                    <div class="d-flex justify-content-between">
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-primary"
                               th:href="@{/update-email}"
                               th:text="'Update Email'">
                            </a>
                            <a class="btn btn-outline-warning"
                               th:href="@{/reset-password}"
                               th:text="'Reset Password'">
                            </a>
                        </div>
                        <div>
                            <a class="btn btn-outline-danger"
                               th:href="@{/dashboard/user/menu}"
                               th:text="'Back'">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>
</body>
</html>
