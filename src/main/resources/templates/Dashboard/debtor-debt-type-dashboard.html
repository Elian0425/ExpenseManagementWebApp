<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Expense Management App - Debtor Debt Type Dashboard'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
  <div class="row">
    <div class="col-12 mx-auto mt-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title text-center mb-3" th:text="'Debtor Debt Type Dashboard'"></h2>

          <div class="d-flex justify-content-between mb-3">

            <div>
              <a class="btn btn-primary" th:href="@{'/debtor/' + ${debtorId} + '/debt/type/add'}" th:text="'Add Debt Type'"></a>
            </div>

            <div>
              <form th:action="@{/dashboard/debtor/search}" method="get" class="d-flex" role="search">
                <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Search name or email">
                <button class="btn btn-outline-secondary btn-sm" type="submit">Search</button>
              </form>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
              <thead class="table-light">
              <tr>
                <th scope="col" th:text="'Name'"></th>
                <th scope="col" th:text="'Created On'"></th>
                <th scope="col" th:text="'Updated On'"></th>
                <th scope="col" th:text="'Actions'"></th>
              </tr>
              </thead>
              <tbody>

              <tr th:if="${debtorDebtTypeList == null or #lists.isEmpty(debtorDebtTypeList)}">
                <td colspan="8" class="text-center py-4" th:text="'No debtor debt types found.'"></td>
              </tr>

              <tr th:each="debtorDebtType, stat : ${debtorDebtTypeList}">

                <!-- Expect debtor.firstName and debtor.lastName (adjust field names to your model) -->
                <td th:text="${debtorDebtType.debtorDebtTypeName}"></td>
                <td th:text="${debtorDebtType.debtorDebtTypePlacedOnDate}"></td>
                <td th:text="${debtorDebtType.debtorDebtTypeUpdatedOnDate}"></td>


                <!-- Actions -->
                <td>
                  <a class="btn btn-sm btn-outline-info" th:href="@{'/debtor/' + ${debtorId} + '/debt/type/' + ${debtorDebtType.debtorDebtTypeId} + '/update'}" th:text="'Update'"></a>
                  <a class="btn btn-sm btn-outline-danger" th:href="@{'/debtor/' + ${debtorId} + '/debt/type/' + ${debtorDebtType.debtorDebtTypeId} + '/delete'}" th:text="'Delete'"></a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-3 d-flex justify-content-between">
            <div>
              <small class="text-muted">Total: <strong th:text="${debtorDebtTypeList != null ? debtorDebtTypeList.size() : 0}">0</strong> debtor debt types</small>
            </div>
            <div>
              <a class="btn btn-outline-danger btn-sm" th:href="@{'/dashboard/debtor/' + ${debtorId} + '/debt'}" th:text="'Back to Dashboard'"></a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
